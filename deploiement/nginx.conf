# Nginx devant Docker.
#
# Nginx ne remplace pas Docker : il reçoit les requêtes, gère le HTTPS, et
# distribue selon le nom de domaine. Les logiciels, eux, tournent dans Docker
# et n'écoutent que sur la boucle locale — c'est ce qui fait qu'on ne peut pas
# les joindre autrement qu'en passant par ici.

# ── L'API Supabase : authentification, données, fichiers ────────────────────
server {
    listen 443 ssl http2;
    server_name api.tutela.cm;

    ssl_certificate     /etc/letsencrypt/live/api.tutela.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tutela.cm/privkey.pem;

    # Les pièces justificatives montent jusqu'à 8 Mo ; la valeur par défaut
    # de Nginx est 1 Mo, et un dépôt refusé pour cette raison ne dit pas
    # pourquoi il a échoué.
    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le temps réel de Supabase passe par WebSocket, et la salle de cours
        # en aura besoin. Sans ces deux lignes, la connexion est refusée avec
        # une erreur qui ne parle pas de WebSocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Un cours dure une heure : une coupure à 60 secondes fermerait la
        # salle en pleine séance.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

# ── Le service Tuteurs ──────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name service.tutela.cm;

    ssl_certificate     /etc/letsencrypt/live/service.tutela.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service.tutela.cm/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
    }

    # La sonde de vie ne doit pas encombrer le journal : elle est appelée
    # toutes les minutes, et noierait tout le reste.
    location /sante {
        proxy_pass http://127.0.0.1:3001/sante;
        access_log off;
    }
}

# ── Le site ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name tutela.cm www.tutela.cm;

    ssl_certificate     /etc/letsencrypt/live/tutela.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutela.cm/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

# ── Tout le reste en clair est redirigé ─────────────────────────────────────
#
# Y compris les requêtes qui n'ont pas de nom de domaine connu : sans ce bloc,
# Nginx sert le PREMIER site de sa liste à qui se présente avec une adresse IP
# nue, ce qui expose l'API à qui scanne des plages d'adresses.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
